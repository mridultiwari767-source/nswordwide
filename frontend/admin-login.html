<!DOCTYPE html> 
<html lang="en"> 
 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
    <title>NS Worldwide | Admin Login</title> 
 
    <style> 
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        } 
 
        body { 
            font-family: Arial, sans-serif; 
            background: #f1f5f9; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        } 
 
        .login-box { 
            width: 380px; 
            background: white; 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12); 
        } 
 
        .logo { 
            text-align: center; 
            margin-bottom: 25px; 
        } 
 
        .logo h1 { 
            color: #102a43; 
            font-size: 28px; 
        } 
 
        .logo p { 
            color: #666; 
            margin-top: 5px; 
        } 
 
        label { 
            display: block; 
            margin-bottom: 7px; 
            font-weight: bold; 
            color: #333; 
        } 
 
        input { 
            width: 100%; 
            padding: 13px; 
            margin-bottom: 18px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 15px; 
            background: white; 
        } 
 
        input:focus { 
            outline: none; 
            border-color: #102a43; 
        } 
 
        button { 
            width: 100%; 
            padding: 13px; 
            background: #102a43; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            cursor: pointer; 
        } 
 
        button:hover { 
            background: #0b2033; 
        } 
 
        #errorMessage { 
            color: #dc2626; 
            text-align: center; 
            margin-top: 15px; 
            display: none; 
        } 
    </style> 
</head> 
 
<body> 
 
    <div class="login-box"> 
 
        <div class="logo"> 
            <h1>NS Worldwide</h1> 
            <p>Admin Login</p> 
        </div> 
 
        <form id="loginForm" autocomplete="off"> 
 
            <label for="username">Username</label> 
 
            <input 
                type="text" 
                id="username" 
                name="admin_username" 
                autocomplete="off" 
                required 
            > 
 
            <label for="password">Password</label> 
 
            <input 
                type="password" 
                id="password" 
                name="admin_password" 
                autocomplete="new-password" 
                required 
            > 
 
            <button type="submit"> 
                Login 
            </button> 
 
            <p id="errorMessage"> 
                Invalid username or password 
            </p> 
 
        </form> 
 
    </div> 
 
    <script> 
        document 
            .getElementById("loginForm") 
            .addEventListener("submit", function(event) { 
 
                event.preventDefault(); 
 
                const username = 
                    document.getElementById("username").value.trim(); 
 
                const password = 
                    document.getElementById("password").value; 
 
                if ( 
                    username === "admin" && 
                    password === "12345" 
                ) { 
 
                    localStorage.setItem( 
                        "adminLoggedIn", 
                        "true" 
                    ); 
 
                    window.location.href = "/admin.html"; 
 
                } else { 
 
                    document.getElementById( 
                        "errorMessage" 
                    ).style.display = "block"; 
                } 
 
            }); 
    </script> 
  
</body> 
 
</html>
