<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Product Details | NS Worldwide</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <style>
        .product-details {
            padding: 70px 5%;
            background: #f7f9fb;
            min-height: 70vh;
        }

        .details-container {
            max-width: 1100px;
            margin: auto;
            background: white;
            border-radius: 12px;
            padding: 35px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .details-image {
            width: 100%;
            height: 400px;
            object-fit: contain;
            border-radius: 10px;
            background: #f5f5f5;
        }

        .details-info h1 {
            font-size: 34px;
            color: #102a43;
            margin-bottom: 15px;
        }

        .details-category {
            display: inline-block;
            background: #e8f1f8;
            color: #1565c0;
            padding: 8px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .details-description {
            font-size: 17px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
        }

        .whatsapp-btn {
            display: inline-block;
            padding: 14px 25px;
            background: #25d366;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 22px;
            background: #102a43;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        @media (max-width: 768px) {

            .details-container {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .details-image {
                height: 280px;
            }

            .details-info h1 {
                font-size: 27px;
            }
        }
    </style>
</head>


<body>

    <section class="product-details">

        <div class="details-container"
            id="productDetails">

            <p>
                Loading product...
            </p>

        </div>

    </section>


    <script>

        // =================================
        // GET PRODUCT ID FROM URL
        // =================================

        const params =
            new URLSearchParams(
                window.location.search
            );

        const productId =
            params.get("id");


        const container =
            document.getElementById(
                "productDetails"
            );


        // =================================
        // CHECK PRODUCT ID
        // =================================

        if (!productId) {

            container.innerHTML = `

                <div>

                    <h2>
                        Product not found
                    </h2>

                    <a
                        href="/"
                        class="back-btn"
                    >
                        ← Back to Products
                    </a>

                </div>

            `;

        } else {


            // =================================
            // GET PRODUCT FROM BACKEND
            // =================================

            fetch(
                `/api/products/${productId}`
            )

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Product not found"
                    );

                }

                return response.json();

            })

            .then(product => {


                // =================================
                // PAGE TITLE
                // =================================

                document.title =
                    `${product.name} | NS Worldwide`;


                // =================================
                // SHOW PRODUCT
                // =================================

                container.innerHTML = `

                    <div>

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                            class="details-image"
                        >

                    </div>


                    <div class="details-info">

                        <span class="details-category">
                            ${product.category}
                        </span>


                        <h1>
                            ${product.name}
                        </h1>


                        <p class="details-description">
                            ${product.description}
                        </p>


                        <a
                            class="whatsapp-btn"
                            href="https://wa.me/919554530206?text=${encodeURIComponent(
                                "Hello NS Worldwide, I want details about " +
                                product.name
                            )}"
                            target="_blank"
                        >

                            <i class="fa-brands fa-whatsapp"></i>

                            Enquire on WhatsApp

                        </a>


                        <br>


                        <a
                            href="/"
                            class="back-btn"
                        >
                            ← Back to Products
                        </a>

                    </div>

                `;

            })


            // =================================
            // ERROR
            // =================================

            .catch(error => {

                console.error(
                    "Product Details Error:",
                    error
                );


                container.innerHTML = `

                    <div>

                        <h2>
                            Product not found
                        </h2>

                        <p>
                            This product is not available.
                        </p>

                        <a
                            href="/"
                            class="back-btn"
                        >
                            ← Back to Products
                        </a>

                    </div>

                `;

            });

        }

    </script>

</body>

</html>
